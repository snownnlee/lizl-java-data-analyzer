<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="${favicon}">
    <title>${title}</title>
    <style>
        html {
            color-scheme: dark
        }

        body {
            margin: 0;
            padding: 16px;
            background: #0a0e17;
            color: #c1c1c1;
            font: 13px/1.5 "Microsoft YaHei UI", ui-rounded, sans-serif
        }

        #diagram svg {
            display: block;
            max-width: none
        }
    </style>
</head>
<body>
<div id="diagram">
    <pre style="color:#8fb4e0">渲染中…</pre>
</div>
${vizTag}
${pumlTag}
<script>
    if (!window.PlantUML) {
        document.getElementById("diagram").innerHTML = "<pre style='color:#ff6b6b'>未找到 ${pumlName}，请确认它与本文件在同一目录</pre>";
    } else {
        // 第三个参数是引擎选项：maxSvgSize 默认 8192px，超限时引擎抛异常且不出图；0 表示关闭该检查
        PlantUML.render(${pumlArray}, "diagram", {maxSvgSize: 0});
    }
</script>
</body>
</html>
