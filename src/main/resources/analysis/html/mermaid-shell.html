<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="${favicon}">
    <title>${title}</title>
    <style>
        html {
            color-scheme: dark
        }

        body {
            margin: 0;
            padding: 16px;
            background: #0a0e17;
            color: #c1c1c1;
            font: 13px/1.5 "Microsoft YaHei UI", ui-rounded, sans-serif
        }

        pre.mermaid {
            display: flex;
            justify-content: center;
            margin: 0
        }
    </style>
</head>
<body>
<pre class="mermaid">${diagram}</pre>
<script src="./${mermaidFile}"></script>
<script>
    if (!window.mermaid) {
        document.body.insertAdjacentHTML("beforeend", "<pre style='color:#ff6b6b'>未找到 ${mermaidFile}，请确认它与本文件在同一目录</pre>");
    } else {
        mermaid.initialize({
            startOnLoad: true,
            theme: "base",
            fontFamily: "Microsoft YaHei UI, sans-serif",
            themeVariables: {
                fontSize: "13px",
                background: "#0a0e17",
                primaryColor: "#0f141e",
                primaryBorderColor: "#6495ed",
                primaryTextColor: "#c1c1c1",
                textColor: "#c1c1c1",
                lineColor: "#6495ed",
                titleColor: "#c1c1c1"
            }
        });
    }
</script>
</body>
</html>
