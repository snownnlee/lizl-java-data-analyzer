<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lizl Java Data Analyzer</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 20% 0%, #101a2e, #070a12 60%);
            color: #e6f0ff;
        }

        .wrap {
            width: min(760px, 92vw);
            padding: 32px 0;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.3rem;
            letter-spacing: .5px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #64ff9e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p.sub {
            margin: 0 0 24px;
            color: #8fb4e0;
            font-size: 13px;
        }

        .cards {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        a.card {
            display: block;
            padding: 18px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            background: rgba(20, 28, 44, .8);
            border: 1px solid rgba(100, 150, 255, .35);
            box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
            transition: .15s;
        }

        a.card:hover {
            border-color: rgba(100, 200, 255, .8);
            box-shadow: 0 0 18px rgba(0, 200, 255, .35);
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .6px;
            color: #0a1220;
            background: linear-gradient(90deg, #00ffff, #64ff9e);
            padding: 2px 8px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .desc {
            font-size: 12.5px;
            color: #a8c6e8;
            line-height: 1.6;
        }

        .missing {
            margin: 22px 0 0;
            padding: 14px 18px;
            border-radius: 8px;
            background: rgba(40, 20, 20, .45);
            border: 1px dashed rgba(255, 120, 120, .4);
            color: #ffb4b4;
            font-size: 12.5px;
            line-height: 1.9;
        }

        .missing ul {
            margin: 0;
            padding-left: 18px;
        }

        code {
            background: rgba(255, 255, 255, .08);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 11.5px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Lizl Java Data Analyzer</h1>
    <p class="sub">选择要查看的通道</p>
    <div class="cards">{{cards}}</div>
    {{missingBlock}}
</div>
</body>
</html>
